<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Tab Multiplier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <header>
      <span class="badge">URL TOOL</span>
      <h1>ID Tab <span>Multiplier</span></h1>
      <p>
        Generate multiple URLs by inserting IDs wherever you place
        <code>{ID}</code>.
      </p>
    </header>

    <section class="card">

      <label for="url">Base URL</label>

      <input
        id="url"
        type="text"
        placeholder="https://example.com/user/{ID}"
      >

      <p class="hint">
        Put <code>{ID}</code> exactly where the ID should be inserted.
      </p>


      <label for="ids">IDs</label>

      <textarea
        id="ids"
        placeholder="12345&#10;67890&#10;54321"
      ></textarea>

      <p class="hint">
        One ID per line. Commas and spaces are also supported.
      </p>


      <div class="actions">
        <button id="generateBtn" class="primary">
          Generate URLs
        </button>

        <button id="clearBtn" class="secondary">
          Clear
        </button>
      </div>

      <div id="message" class="message"></div>

    </section>


    <section id="resultsSection" class="card results-card hidden">

      <div class="results-head">

        <div>
          <label>Generated URLs</label>
          <span id="count" class="count">0</span>
        </div>

        <div class="results-actions">
          <button id="copyBtn" class="secondary small">
            Copy All
          </button>

          <button id="openAllBtn" class="primary small">
            Open All Tabs
          </button>
        </div>

      </div>

      <div id="results" class="results"></div>

    </section>


    <footer>
      <span>Runs entirely in your browser</span>
      <span>•</span>
      <span>No data is uploaded</span>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
